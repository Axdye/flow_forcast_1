# CPU smoke fixture.  Results are labelled synthetic and are not paper evidence.
schema_version: 1
protocol_id: synthetic_smoke_v1
method_id: sbona_structured
seed: 7

data:
  dataset: synthetic
  input_steps: 12
  output_steps: 12
  split_ratios: [0.6, 0.2, 0.2]
  steps_per_day: 288
  scaler: global_standard_train_only
  missing_policy: source_mask_else_nonfinite
  zeros_are_valid: true
  envelope_quantile: 0.995
  envelope_min_count: 1000
  mape_min_abs_target: 1.0
  synthetic: true
  synthetic_num_nodes: 8
  synthetic_num_steps: 240
  synthetic_missing_fraction: 0.01
  timestamps_available: false
  time_of_day: true
  day_of_week: false
  flow_channel: 0

graph:
  topology: published_binary_undirected
  diffusion: row_normalized_with_self_loops
  representation: sparse_coo

backbone:
  name: staeformer
  mode: frozen
  input_dim: 1
  use_mixed_proj: true
  input_embedding_dim: 24
  tod_embedding_dim: 24
  dow_embedding_dim: 0
  spatial_embedding_dim: 0
  adaptive_embedding_dim: 80
  feed_forward_dim: 128
  num_heads: 4
  num_layers: 2
  dropout: 0.1

adapter:
  num_candidates: 4
  hidden_dim: 32
  residual_dim: 16
  graph_hops: 2
  sigma_min: 0.05
  local_branch: false
  film: false
  s_p: 1.0
  s_o: 0.5
  s_d: 0.5
  residual_scale: 3.0
  output_init_std: 0.001

oracle:
  alpha: 1.0
  temperature: 0.5
  std_floor: 0.001
  std_correction: 0

loss:
  consistency: 0.1
  penalty_negative: 1.0
  penalty_envelope: 1.0
  penalty_spatial: 0.1
  epsilon_floor: 0.05
  separation: 0.01
  separation_margin: 0.25
  router_kl: 1.0
  regret: 0.2
  balance_max: 0.01

training:
  precision: fp32
  initial_batch_size: 8
  eval_batch_size: 8
  accumulation: 1
  base_lr: 0.001
  candidate_lr: 0.001
  router_lr: 0.0003
  weight_decay: 0.0001
  gradient_clip: 5.0
  max_epochs: {base: 2, single: 2, candidates: 2, router: 2, probe: 2}
  patience: {base: 2, single: 2, candidates: 2, router: 2, probe: 2}
  scheduler: constant
  checkpoint_min_delta: 0.00001
  freeze_candidates_for_router: true
  device: cpu

evaluation:
  primary_metric: raw_mae_all
  horizons: [3, 6, 12]
  clip_predictions: false
  selection_granularity: whole_sample_trajectory
  bootstrap_replicates: 200
  block_origins: 24
  bootstrap_seed: 20261028
